<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スポット投稿</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="spotpost.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>アプリ名</h1>
            <nav class="nav-links">
                <a href="home.html">ホーム</a>
                <a href="#">ログアウト</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="spot-post-section">
            <h2>スポット投稿</h2>
            <form action="/spotpost" method="POST" enctype="multipart/form-data" class="spot-form">
                <label for="spot-name">スポット名</label>
                <input type="text" id="spot-name" name="spot-name" required>

                <h2>
                    ジャンル
                    <div id="extra-genres" class="extra-genres hidden">
                        <label><input type="checkbox" value="spiritual"> 心霊</label>
                        <label><input type="checkbox" value="view"> 絶景</label>
                        <label><input type="checkbox" value="aquarium"> 水族館</label>
                        <label><input type="checkbox" value="amusement"> 遊園地</label>
                    </div>
                </h2>
                <div class="genre-options">
                    <label><input type="checkbox" name="genre" value="family"> 家族</label>
                    <label><input type="checkbox" name="genre" value="friends"> 友人</label>
                    <label><input type="checkbox" name="genre" value="date"> デート</label>
                    <label><input type="checkbox" name="genre" value="popular"> 人気</label>
                </div>

                <label for="photo1">写真</label>
                <input type="file" id="photo1" name="photo1" accept="image/*">

                <label for="photo2">次の写真</label>
                <input type="file" id="photo2" name="photo2" accept="image/*">

                <label for="description">紹介文</label>
                <textarea id="description" name="description" rows="4" placeholder="スポットの紹介文を入力してください"></textarea>

                <label for="url">URL</label>
                <input type="url" id="url" name="url" placeholder="https://example.com">

                <button type="submit">投稿</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 芽吹樹のアプリ</p>
    </footer>
</body>
</html>
