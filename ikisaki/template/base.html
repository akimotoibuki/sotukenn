<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}行先選定アプリ{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <h1>行先選定アプリ</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">ホーム</a></li>
                <li><a href="{{ url_for('about') }}">このサイトについて</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        <p>ここにコンテンツが入ります。</p>
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 芽吹樹のWebサイト</p>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
