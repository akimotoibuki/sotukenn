<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スポット詳細</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/spotdetail.css') }}">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>アプリ名</h1>
            <nav class="nav-links">
                <a href="home.html">ホーム</a>
                <a href="#">ログアウト</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="spot-detail-section">
            <h2 class="spot-title">スポット名</h2>
            <div class="photo-area">
                <img src="photo1.jpg" alt="スポット写真1" class="spot-photo">
                <img src="photo2.jpg" alt="スポット写真2" class="spot-photo">
                <button class="next-photo-button">次の写真</button>
            </div>

            <div class="description-area">
                <h3>紹介文</h3>
                <p>このスポットは自然が豊かで、家族や友人とのお出かけにぴったりです。季節ごとの景色も楽しめます。</p>
            </div>

            <div class="url-area">
                <h3>URL</h3>
                <a href="https://example.com" target="_blank">https://example.com</a>
            </div>

            <div class="action-icons">
                <button class="favorite-button">⭐ お気に入り</button>
                <button class="like-button">❤️ イイネ</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 芽吹樹のアプリ</p>
    </footer>
</body>
</html>
